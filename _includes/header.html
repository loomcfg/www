<header class="site-header">
  <div class="container nav-inner">
    <a href="{{ '/' | relative_url }}" class="brand" aria-label="LoomCFG Home">

      <span class="brand-wordmark">
        <span class="brand-loom">Loom</span><span class="brand-cfg">CFG</span>
      </span>
    </a>

    <nav class="nav-links" id="navLinks" aria-label="Primary Navigation">
      <a href="{{ '/docs/quickstart/' | relative_url }}" class="nav-link {% if page.url contains '/docs' %}active{% endif %}">Docs</a>
      <a href="{{ '/docs/spec/' | relative_url }}" class="nav-link {% if page.url contains '/spec' %}active{% endif %}">Spec</a>
      <a href="{{ '/playground/' | relative_url }}" class="nav-link {% if page.url contains '/playground' %}active{% endif %}">Playground</a>
      <a href="https://github.com/loomcfg" target="_blank" rel="noopener" class="nav-link nav-github">

    <div class="nav-actions">
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle color theme" title="Toggle theme">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
      </button>
      <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation menu" aria-expanded="false">
        ☰
